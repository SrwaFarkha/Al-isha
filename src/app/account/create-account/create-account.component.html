<div class="grid-container">
    <div class="form-container">
        <div class="title">Create Account</div>
        <form [formGroup]="createAccountForm" (ngSubmit)="onSubmit()">
            <div class="two-column">
                <div>
                    <!-- <label>First Name</label> -->
                    <input type="text" class="input-field" placeholder="First Name" formControlName="firstName" />
                </div>
                <div>
                    <!-- <label>Last Name</label> -->
                    <input type="text" class="input-field" placeholder="Last Name" formControlName="lastName" />
                </div>
            </div>

            <div class="one-column">
        <!-- <label>Email</label> -->
                <input type="email" class="input-field" placeholder="Email" formControlName="email" />
            </div>

            <div class="one-column">
            <!-- <label>Phone Number</label> -->
                <input type="text" class="input-field" placeholder="Phone Number" formControlName="phoneNumber" />
            </div>

            <div class="one-column">
                
            <!-- <label>Password</label> -->
            <input type="password" class="input-field" placeholder="Password" formControlName="password" />
            </div>


            <div class="two-column">
                <div>
                    <!-- <label>Country</label> -->
                    <input type="text" class="input-field" placeholder="Country" formControlName="country" />
                </div>
                <div>
                    <!-- <label>City</label> -->
                    <input type="text" class="input-field" placeholder="City" formControlName="city" />
                </div>
            </div>

            <div class="two-column">
                <div>
                    <!-- <label>Post Number</label> -->
                    <input type="text" class="input-field" placeholder="Post Number" formControlName="postNumber" />
                </div>
                <div>
                    <!-- <label>Street Address</label> -->
                    <input type="text" class="input-field" placeholder="Street Address" formControlName="streetAddress" />
                </div>
            </div>
            <div class="grid-create-button">
                <button class="create-button" type="submit" [disabled]="createAccountForm.invalid">
                    Create
                </button>
            </div>
    
        </form>
    </div>
</div>
