<div class="grid-container">
  <div class="form-container">
    <div class="title"> Log in </div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label for="uname">Email</label>
      <input
        type="text"
        id="uname"
        placeholder="Enter Email"
        formControlName="email"
        required
      />
      <div 
        class="error-hidden" 
        [class.hidden]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
      </div>
      <div class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        <small>Valid email is required.</small>
      </div>

      <label for="psw">Password</label>
      <input
        type="password"
        id="psw"
        placeholder="Enter Password"
        formControlName="password"
        required
      />
      <div class="container">
        <div class="left">
          <div 
              class="error-hidden" 
              [class.hidden]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            </div>
            <div class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
              <small>Password is required.</small>
            </div>
        </div>
        <div class="right">
          <div class="forgotten" (click)="onForgotPassword()">
            Forgotten your password?
          </div>
        </div>
      </div>
  

      <div 
        class="error-hidden2" 
        [class.hidden]="loginErrorText">
      </div>
      <div class="error" *ngIf="loginErrorText">
        <small>{{ loginErrorText }}</small>
      </div>

      <button type="submit">Login</button>

    </form>
  </div>
</div>
